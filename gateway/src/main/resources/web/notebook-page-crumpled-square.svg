<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<!--
  Square gridless crumpled paper. Used as the page background.

  Crumple effect: feTurbulence noise → feDiffuseLighting → multiply blend
  on paper. Multiply at a gentle 70-100% intensity range gives natural
  paper shading: lit areas unchanged, creases slightly darker (not muddy
  near-black like the previous unconstrained multiply, and not blown-out
  blotchy like the color-dodge attempt). This is the digital-art
  default for textured-paper overlays — multiply with a tame range.

  CSS-tunable hooks:
    paper-color          — paper fill           (default #fdfbf3)
    crumple-highlight    — lighting tint color  (default white)
    crumple-frequency    — noise period         (default 0.012)  *
    crumple-depth        — wrinkle depth        (default 4)      *

  * `crumple-frequency` and `crumple-depth` are best-effort: they're set
    via inline `style` on filter primitives, but baseFrequency and
    surfaceScale aren't standardised CSS properties (only lighting-color
    and flood-color reliably are). On browsers that don't honour them,
    the SVG attribute defaults apply. For coherent crumple density across
    panels of very different sizes, a separate SVG variant per density
    tier is the fallback.
-->
  <symbol id="paper-crumpled-square" viewBox="0 0 600 600" overflow="visible">
    <defs>
      <filter id="crumple-square" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3"
                      seed="7" result="noise"
                      style="base-frequency: var(--crumple-frequency, 0.012);"/>

        <feDiffuseLighting in="noise" surfaceScale="4" diffuseConstant="1"
                           lighting-color="white"
                           style="lighting-color: var(--crumple-highlight, white);
                                  surface-scale: var(--crumple-depth, 4);"
                           result="lightRaw">
          <feDistantLight azimuth="135" elevation="45"/>
        </feDiffuseLighting>

        <!-- Compress lighting to a gentle 70-100% range. Multiplying with
             this keeps lit areas at full paper colour and only takes
             creases down to ~70% — visible shading without muddy
             near-black or blown-out highlights. -->
        <feComponentTransfer in="lightRaw" result="lightSoft">
          <feFuncR type="linear" slope="0.3" intercept="0.7"/>
          <feFuncG type="linear" slope="0.3" intercept="0.7"/>
          <feFuncB type="linear" slope="0.3" intercept="0.7"/>
        </feComponentTransfer>

        <feComposite in="lightSoft" in2="SourceGraphic" operator="in" result="lightMasked"/>
        <feBlend in="SourceGraphic" in2="lightMasked" mode="multiply"/>
      </filter>
    </defs>

    <rect width="600" height="600"
          fill="var(--paper-color, #fdfbf3)"
          filter="url(#crumple-square)"/>
  </symbol>
  <use href="#paper-crumpled-square"/>
</svg>
