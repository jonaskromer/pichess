<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -10 628 824">
<!--
  Clean (un-crumpled) notebook page. Two CSS variables drive the colours;
  defaults baked into each var(...) call render the file standalone:

    paper-color   page background fill   (#fdfbf3 cream)
    grid-color    ruled-grid stroke      (#b9d3e7 light blue)

  Same self-contained sprite structure as `peach.svg`: the symbol holds
  its own <style> and <defs> so a cross-document `<use href="…#paper-clean"/>`
  from the host page renders correctly without inner-use indirection or
  cross-document filter references. CSS variables inherited from the host's
  `:root` cascade through `<use>` and re-tint the page for dark mode.
-->
  <symbol id="paper-clean" viewBox="-14 -10 628 824" overflow="visible">
    <!--
      Colours come via `fill="var(...)"` / `stroke="var(...)"` inline rather
      than a <style> block. Inline `var()` on attributes propagates reliably
      through cross-document `<use href="external.svg#id">`; CSS variable
      cascade into a <style> nested inside a <symbol> is browser-flaky
      (light-blue grid persisted in dark mode despite a :root.dark override).
    -->
    <defs>
      <filter id="page-shadow" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/>
      </filter>
      <pattern id="grid-minor" width="24" height="24" patternUnits="userSpaceOnUse">
        <path stroke="var(--grid-color, #b9d3e7)" fill="none"
              stroke-width="0.6" stroke-opacity="0.55"
              d="M 24 0 L 0 0 L 0 24"/>
      </pattern>
      <pattern id="grid-major" width="120" height="120" patternUnits="userSpaceOnUse">
        <path stroke="var(--grid-color, #b9d3e7)" fill="none"
              stroke-width="1.1" stroke-opacity="0.9"
              d="M 120 0 L 0 0 L 0 120"/>
      </pattern>
      <clipPath id="paper-clip">
        <rect x="0" y="0" width="600" height="800" rx="2"/>
      </clipPath>
    </defs>

    <!-- paper with drop shadow -->
    <rect x="0" y="0" width="600" height="800" rx="2"
          fill="var(--paper-color, #fdfbf3)" filter="url(#page-shadow)"/>

    <!-- grid, clipped to the paper so it doesn't bleed past rounded corners -->
    <g clip-path="url(#paper-clip)">
      <rect x="0" y="0" width="600" height="800" fill="url(#grid-minor)"/>
      <rect x="0" y="0" width="600" height="800" fill="url(#grid-major)"/>
      <!-- right & bottom edges (the grid pattern only draws top & left of each cell) -->
      <path stroke="var(--grid-color, #b9d3e7)" fill="none"
            stroke-width="1.1" stroke-opacity="0.9"
            d="M 600 0 L 600 800 M 0 800 L 600 800"/>
    </g>
  </symbol>
  <use href="#paper-clean"/>
</svg>
