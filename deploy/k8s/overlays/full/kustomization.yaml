apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pichess
# full = lobbies + durable persistence: repository read-side, Kafka event log,
# Mongo primary store, Redis cache. The configMapGenerator below merges the
# durable-backend values over the base's in-memory ones; the resulting hash
# change rolls the JVM pods onto mongo+kafka+redis automatically. Needs ~8-12 GB
# RAM (5 JVMs + Kafka + Mongo) — see docs/deployment-plan.md and project memory.
resources:
  - ../lobbies
  - mongodb.yaml
  - redis.yaml
  - kafka.yaml
  - repository.yaml
  # Optional containerised tournament bot (gateway-signalled control API). It
  # only talks OUTBOUND to the NowChess server, so it rides the full tier here.
  - bot-tournament.yaml

configMapGenerator:
  - name: pichess-config
    behavior: merge
    literals:
      - PICHESS_BACKEND=mongo
      - PICHESS_CACHE=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=pichess-repository
      - PICHESS_MONGO_URL=mongodb://mongodb:27017
      - PICHESS_MONGO_DB=pichess
      - PICHESS_REDIS_HOST=redis
      - PICHESS_REDIS_PORT=6379
      - REPOSITORY_PORT=8091
      # Spectate's default "piChess bot games only" filter matches tournament
      # games by the bot's registered name — keep in sync with
      # bot-tournament.yaml's TOURNAMENT_BOT_NAME (gateway defaults to "pichess"
      # otherwise, which would hide every game on this tier).
      - PICHESS_BOT_NAME=piChess

images:
  - name: ghcr.io/jonaskromer/pichess-repository
    newTag: "0.3.1"
  - name: ghcr.io/jonaskromer/pichess-bot-tournament
    newTag: "0.3.1"
