apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pichess

resources:
  - namespace.yaml
  - configmap.yaml
  - game-service.yaml
  - gateway.yaml
  - ingress.yaml

# Pin the image tag here per release (the version published by release.yml).
# Bump `newTag` when you cut a new version; keep it in sync with image_tag in
# deploy/ansible/group_vars/all.yml.
images:
  - name: ghcr.io/jonaskromer/pichess-gateway
    newTag: "0.0.2"
  - name: ghcr.io/jonaskromer/pichess-game-service
    newTag: "0.0.2"
