[defaults]
inventory            = inventory.ini
roles_path           = roles
collections_path     = collections
stdout_callback        = default
callback_result_format = yaml
gathering            = smart
interpreter_python   = auto_silent
retry_files_enabled  = False
# Ephemeral, campus-internal VMs whose host keys change on re-image — don't
# fail on a changed key. (We're already inside the VPN; the threat model is low.)
host_key_checking    = False

[ssh_connection]
# Survive a flaky VPN: a persistent multiplexed control socket + keepalives so
# a brief drop doesn't kill the run, plus retries on transient connection loss.
ssh_args     = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ConnectTimeout=20
retries      = 3
pipelining   = True
