# Pichess microservice stack.
#
#   postgres       — relational primary store for the polyglot persistence
#                    demo. Active when PICHESS_BACKEND=postgres.
#   mongodb        — document primary store. Active when PICHESS_BACKEND=mongo.
#   redis          — key-value primary store AND optional always-on cache
#                    decorator. Active for primary when PICHESS_BACKEND=redis;
#                    active as cache when PICHESS_CACHE=redis (any backend).
#   cassandra      — wide-column primary store. Active when
#                    PICHESS_BACKEND=cassandra.
#   neo4j          — graph DB; supplementary projection (always-on).
#                    opening-service consumes Kafka and builds an opening
#                    tree of (Position)-[:MOVE]->(Position) edges.
#   clickhouse     — OLAP DB; supplementary projection (always-on).
#                    analytics-service consumes Kafka into a flat
#                    move_events table and serves aggregate queries on :8093.
#   kafka          — single-broker KRaft Kafka (no Zookeeper). Backs the
#                    chess.game-events event log.
#   game-service   — authoritative game state. Exposes gRPC on :9000 and
#                    publishes events to Kafka after each state transition.
#                    Persistence backend selected by PICHESS_BACKEND.
#   repository     — REST surface for read-side queries (Gatling + curl).
#                    Consumes chess.game-events and persists the latest FEN.
#   lobby-service  — REST surface for 2-player lobby management on :8092.
#                    Generates invite codes, tracks join/start/close.
#   gateway        — public HTTP entry point (REST + SSE + Laminar web-ui).
#                    Calls game-service over gRPC.
#
# Build the images first:
#   sbt dockerBuildAll
#
# Then:
#   docker compose up
#
# Browse http://localhost:8090 for the web UI. Repository REST is on
# http://localhost:8091, lobby REST on http://localhost:8092, game-service
# gRPC on localhost:9000.

services:
  # ---------------------------------------------------------------------------
  # Persistence backends (selectable via docker-compose profiles)
  #
  # Each backend service is tagged with its own profile. Only the profile(s)
  # passed via `--profile <name>` (or implied by `COMPOSE_PROFILES=`) come
  # up. The Makefile `stack-*` targets pick a profile and ALSO set
  # PICHESS_BACKEND so the application picks the matching impl.
  #
  # Default behaviour (no profile): no DB starts; services fall back to
  # PICHESS_BACKEND=inmemory. Useful for testing the smallest possible
  # footprint.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pichess-postgres
    profiles: ["postgres"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "pichess"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pichess"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: pichess-mongodb
    profiles: ["mongo"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ping:1}).ok' | mongosh --quiet | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pichess-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cassandra:
    image: cassandra:4.1
    container_name: pichess-cassandra
    profiles: ["cassandra"]
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "pichess"
      CASSANDRA_DC: "datacenter1"
      # Single-node cluster — no need for the JVM heap defaults for a small
      # dev container. Keeps ~3GB off the host.
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  neo4j:
    image: neo4j:5
    container_name: pichess-neo4j
    profiles: ["opening"]
    ports:
      - "7474:7474"   # Neo4j Browser (web UI)
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: "neo4j/password"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: pichess-clickhouse
    profiles: ["analytics"]
    ports:
      - "8123:8123"   # HTTP (also what JDBC speaks)
      - "9009:9000"   # Native TCP — remapped so it doesn't collide with gameService
    # No CLICKHOUSE_DB / CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT here, by
    # design. Setting either of them flips the entrypoint into an "init
    # phase" that binds clickhouse-server to 127.0.0.1 only and ping-loops
    # on http_port until ready, then restarts on 0.0.0.0. Under our tight
    # resource limits that init loop can hang indefinitely (and `default`
    # already exists out of the box, so creating it would be a no-op).
    # AnalyticsSchema.ensure handles `CREATE TABLE IF NOT EXISTS
    # move_events` at the application layer, which is the correct seam.
    # ClickHouse defaults still assume a multi-core production server, so
    # dev-limits.xml drops memory/cache/pool knobs to something a laptop
    # can survive.
    volumes:
      - ./docker/clickhouse/dev-limits.xml:/etc/clickhouse-server/config.d/dev-limits.xml:ro
    # Hard-cap container memory. ClickHouse refuses to come up cleanly
    # below ~4 GiB — auto-tuning needs the headroom for query cache,
    # merges buffer, and Jemalloc arenas. Matches the Altinity small-
    # server guide's stated minimum. dev-limits.xml does NOT override
    # these caps any more; ClickHouse's cgroup auto-tuning produces
    # sensible numbers from `mem_limit` on its own.
    mem_limit: 4g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # `clickhouse-client` ships with the server image and speaks the
      # native protocol on port 9000 — same path the JDBC driver and the
      # analytics-service use, so a passing healthcheck means we're
      # actually serving queries (not merely "process is up").
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: pichess-kafka
    # Kafka is the event log feeding the opening + analytics projection
    # services. When neither is selected, Kafka stays down — `game-service`
    # and `repository` still start (their kafka depends_on is required:false
    # below) and skip event publishing.
    profiles: ["analytics", "opening"]
    # Two listeners:
    #   PLAINTEXT      :9092  advertised as kafka:9092       — for in-network containers
    #                                                          (game-service, repository,
    #                                                           opening, analytics)
    #   PLAINTEXT_HOST :29092 advertised as localhost:29092   — for host-side k6 (xk6-kafka)
    #                                                          and any ad-hoc kcat probes
    # Keeping the internal advertised listener at kafka:9092 means existing
    # services don't change their KAFKA_BOOTSTRAP_SERVERS.
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "pichess-cluster-0001"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  game-service:
    image: pichess-game-service:latest
    pull_policy: never
    container_name: pichess-game-service
    # Wait only for whichever DB is actually selected; `required: false`
    # tells compose "if this dependency isn't in the active profile set,
    # don't block startup on it". The application's PICHESS_BACKEND env
    # picks the matching impl at runtime.
    depends_on:
      kafka:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      mongodb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      cassandra:
        condition: service_healthy
        required: false
    ports:
      - "9000:9000"
    environment: &persistence-env
      GRPC_PORT: "9000"
      # Kafka is profile-gated (active when `opening` or `analytics` is
      # selected). When neither profile is up, leave the bootstrap empty
      # so game-service / repository fall back to in-memory / skip the
      # consumer — Kafka is the event log, not a hard requirement.
      KAFKA_BOOTSTRAP_SERVERS: "${PICHESS_KAFKA:-}"
      # Persistence selection. Default `inmemory` keeps state in-process.
      # Set PICHESS_BACKEND to one of: inmemory, postgres, mongo, redis,
      # cassandra. Set PICHESS_CACHE=redis to wrap the primary in a Redis
      # cache decorator (orthogonal to backend choice).
      PICHESS_BACKEND: "${PICHESS_BACKEND:-inmemory}"
      PICHESS_CACHE: "${PICHESS_CACHE:-none}"
      PICHESS_PG_URL: "jdbc:postgresql://postgres:5432/pichess"
      PICHESS_PG_USER: "postgres"
      PICHESS_PG_PASSWORD: "postgres"
      PICHESS_MONGO_URL: "mongodb://mongodb:27017"
      PICHESS_MONGO_DB: "pichess"
      PICHESS_REDIS_HOST: "redis"
      PICHESS_REDIS_PORT: "6379"
      PICHESS_CASSANDRA_CONTACT_POINTS: "cassandra:9042"
      PICHESS_CASSANDRA_DC: "datacenter1"
      PICHESS_CASSANDRA_KEYSPACE: "pichess"
      PICHESS_NEO4J_URL: "bolt://neo4j:7687"
      PICHESS_NEO4J_USER: "neo4j"
      PICHESS_NEO4J_PASSWORD: "password"
      PICHESS_CLICKHOUSE_URL: "jdbc:clickhouse://clickhouse:8123/default"
      PICHESS_CLICKHOUSE_USER: "default"
      PICHESS_CLICKHOUSE_PASSWORD: ""
      # PICHESS_PROFILE=sampling activates chess.obs.ProfilerLayer; the
      # service then dumps stack-collapsed profile files to
      # /var/log/pichess on shutdown, which is bind-mounted below.
      PICHESS_PROFILE: "${PICHESS_PROFILE:-off}"
      # TRACING_ENABLED=true makes chess.obs.TracingLayer use the live
      # OTLP gRPC exporter (pointed at the jaeger container's :4317);
      # any other value picks the no-op layer that never opens a
      # connection. Default is off so services that aren't running the
      # `obs` profile don't churn on a dead exporter.
      TRACING_ENABLED: "${TRACING_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}"
    volumes: &profile-volume
      - ./perf-reports/profiles:/var/log/pichess

  repository:
    image: pichess-repository:latest
    pull_policy: never
    container_name: pichess-repository
    depends_on:
      kafka:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      mongodb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      cassandra:
        condition: service_healthy
        required: false
    ports:
      - "8091:8091"
    environment:
      <<: *persistence-env
      REPOSITORY_PORT: "8091"
      KAFKA_CONSUMER_GROUP: "pichess-repository"
    volumes: *profile-volume
    healthcheck:
      # Repository exposes no /health yet; hit an arbitrary game ID and
      # treat a 404 as "server is up and responding".
      test: ["CMD-SHELL", "wget -qO- --server-response http://localhost:8091/games/healthcheck 2>&1 | grep -q '404'"]
      interval: 5s
      timeout: 2s
      retries: 5

  lobby-service:
    image: pichess-lobby-service:latest
    pull_policy: never
    container_name: pichess-lobby-service
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mongodb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      cassandra:
        condition: service_healthy
        required: false
    ports:
      - "8092:8092"
    environment:
      <<: *persistence-env
      LOBBY_PORT: "8092"
    volumes: *profile-volume
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/healthcheck 2>&1 | grep -q ok"]
      interval: 5s
      timeout: 2s
      retries: 5

  opening-service:
    image: pichess-opening-service:latest
    pull_policy: never
    container_name: pichess-opening-service
    profiles: ["opening"]
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_CONSUMER_GROUP: "pichess-opening"
      PICHESS_NEO4J_URL: "bolt://neo4j:7687"
      PICHESS_NEO4J_USER: "neo4j"
      PICHESS_NEO4J_PASSWORD: "password"
    volumes: *profile-volume

  analytics-service:
    image: pichess-analytics-service:latest
    pull_policy: never
    container_name: pichess-analytics-service
    profiles: ["analytics"]
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8093:8093"
    environment:
      ANALYTICS_PORT: "8093"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_CONSUMER_GROUP: "pichess-analytics"
      PICHESS_CLICKHOUSE_URL: "jdbc:clickhouse://clickhouse:8123/default"
      PICHESS_CLICKHOUSE_USER: "default"
      PICHESS_CLICKHOUSE_PASSWORD: ""
    volumes: *profile-volume
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8093/healthcheck 2>&1 | grep -q ok"]
      interval: 5s
      timeout: 2s
      retries: 5

  gateway:
    image: pichess-gateway:latest
    pull_policy: never
    container_name: pichess-gateway
    depends_on:
      game-service:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      HTTP_PORT: "8090"
      GAME_SERVICE_GRPC: "game-service:9000"
      # The active stack profile + any extras the Makefile selected.
      # Surfaced read-only via GET /api/stack-info so the UI can render
      # an "Active stack: postgres" chip on the /dev page.
      PICHESS_STACK: "${PICHESS_BACKEND:-inmemory}"
      PICHESS_STACK_EXTRAS: "${PICHESS_EXTRAS:-}"
      # When set to "true" the /dev/* routes light up and the UI
      # surfaces the Dev link on the start screen post-it.
      PICHESS_DEV: "${PICHESS_DEV:-false}"
      PICHESS_PROFILE: "${PICHESS_PROFILE:-off}"
      TRACING_ENABLED: "${TRACING_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}"
    volumes: *profile-volume

  # ---------------------------------------------------------------------------
  # Observability — opt-in via `EXTRA=obs` on the make stack-* targets.
  #
  # Each microservice exposes Prometheus exposition on its dedicated
  # metrics port (9101–9106) regardless of profile; the `obs` profile
  # brings up a Prometheus to scrape them and a Grafana to visualise the
  # result. Both are memory-capped because the dev rig is a MacBook Air.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: pichess-prometheus
    profiles: ["obs"]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pichess-grafana
    profiles: ["obs"]
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      # Anonymous read-only access — the dev rig is single-user, no need
      # for a login screen. Override these for any non-dev deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_USERS_DEFAULT_THEME: "light"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m

  # Jaeger all-in-one: receives OTLP gRPC on :4317 from every microservice
  # (via chess.obs.TracingLayer) and serves the trace UI on :16686. Used
  # as a one-container alternative to running otel-collector + Tempo —
  # adequate for dev-rig RAM constraints (~500MB instead of ~1.5GB).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: pichess-jaeger
    profiles: ["obs"]
    ports:
      - "16686:16686"   # web UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    mem_limit: 512m

  # Headless control surface. Not in the default compose profile — `up`
  # doesn't start it. Spawn one via `make tui` (or
  # `docker compose run --rm tui-service`) to drop into an interactive
  # session against the gateway. Multiple instances can be run side-by-side
  # for bots-vs-bots scenarios; they all hit the same gateway over HTTP.
  tui-service:
    image: pichess-tui:latest
    pull_policy: never
    container_name: pichess-tui
    profiles: ["tui"]
    depends_on:
      gateway:
        condition: service_started
    stdin_open: true
    tty: true
    environment:
      PICHESS_GATEWAY_URL: "http://gateway:8090"

  # k6 — Layer 1b of the perf stack (see docs/performance.md). Covers
  # surfaces Gatling can't: real-browser Web Vitals, direct Kafka
  # producer load (later), direct gRPC against game-service (later).
  # Driven by scripts/k6-run.sh — `docker compose run --rm k6 …` rather
  # than `up -d` because k6 is a one-shot load generator, not a daemon.
  k6:
    build: ./k6
    image: pichess-k6:latest
    container_name: pichess-k6
    profiles: ["k6"]
    # host networking so localhost:8090 (gateway), localhost:9092 (kafka,
    # when exposed) and localhost:8091 (game-service gRPC) all resolve
    # the same way they do from the host's shell.
    network_mode: host
    volumes:
      - ./k6/scripts:/scripts:ro
      # Mount lib under /k6lib (NOT /lib) — Alpine ships the musl
      # dynamic linker (ld-musl-*.so.1) in /lib, which Chromium needs.
      # Bind-mounting over /lib shadows the linker and every dynamic
      # binary in the container fails to load (manifests as a misleading
      # "file does not exist: /usr/lib/chromium/chromium" from k6).
      - ./k6/lib:/k6lib:ro
      # Proto definitions for the gRPC surface — k6's client.load(...)
      # resolves imports relative to the first arg. Mounted read-only.
      - ./proto/src/main/protobuf:/proto:ro
      - ./perf-reports:/out
    environment:
      K6_GATEWAY_URL: "${K6_GATEWAY_URL:-http://localhost:8090}"
      K6_LOBBY_URL:   "${K6_LOBBY_URL:-http://localhost:8092}"
      # Kafka uses the host-side listener (advertised as localhost:29092
      # by the kafka service above) — the in-network kafka:9092 isn't
      # resolvable from a network_mode: host container.
      K6_KAFKA_BROKERS: "${K6_KAFKA_BROKERS:-localhost:29092}"
      # game-service maps its gRPC port (9000) on the host.
      K6_GRPC_TARGET:   "${K6_GRPC_TARGET:-localhost:9000}"
      # PICHESS_K6_* names so k6 doesn't treat them as overrides for
      # its reserved K6_VUS / K6_DURATION (which would force a default
      # scenario and skip the browser type wiring).
      PICHESS_K6_VUS:      "${PICHESS_K6_VUS:-5}"
      PICHESS_K6_DURATION: "${PICHESS_K6_DURATION:-30s}"
    mem_limit: 1g

networks:
  default:
    name: pichess
