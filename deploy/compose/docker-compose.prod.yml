# piChess — PRODUCTION compose stack, tier-equivalent to the k3d/k8s overlays.
#
# Unlike the dev-rig docker-compose.yml at the repo root (local `pichess-*:latest`
# builds, polyglot-persistence + obs + perf profiles), this pulls the released,
# public ghcr images and exposes only the gateway. Tiers mirror deploy/k8s exactly
# and are selected by an --env-file, which sets COMPOSE_PROFILES + the backend env:
#
#   mvp      gateway + game-service                         (inmemory)
#   lobbies  + lobby-service                                (inmemory)
#   full     + repository + mongo + redis + kafka           (durable, event log)
#
# Run a tier (the env-file is the single source of truth for the tier):
#   docker compose --env-file mvp.env     -f docker-compose.prod.yml up -d --remove-orphans
#   docker compose --env-file lobbies.env -f docker-compose.prod.yml up -d --remove-orphans
#   docker compose --env-file full.env    -f docker-compose.prod.yml up -d --remove-orphans
#
# Downgrade = bring up the lower tier (flips the backend env), THEN remove the
# higher-tier services explicitly — compose does NOT stop profile-disabled
# services on its own, so `--remove-orphans` is not enough:
#   docker compose --env-file lobbies.env -f docker-compose.prod.yml up -d --remove-orphans
#   docker compose -f docker-compose.prod.yml rm -sf mongodb redis kafka repository
# The named data volumes survive the rm (mirrors reset.yml keeping the PVCs).
# Teardown  = `... --profile mvp --profile lobbies --profile full down` (add -v to wipe data).
#
# A fixed project name namespaces every container/network/volume as `pichess-prod-*`,
# so this stack coexists cleanly with the dev-rig compose (project `pichess`).
name: pichess-prod

services:
  # --- mvp: always on -------------------------------------------------------
  game-service:
    image: ${PICHESS_REGISTRY:-ghcr.io/jonaskromer}/pichess-game-service:${PICHESS_IMAGE_TAG:-0.0.2}
    profiles: ["mvp", "lobbies", "full"]
    restart: unless-stopped
    depends_on:
      mongodb: {condition: service_healthy, required: false}
      redis:   {condition: service_healthy, required: false}
      kafka:   {condition: service_healthy, required: false}
    environment:
      GRPC_PORT: "9000"
      # Tier-varying config (set by full.env; defaults = mvp/lobbies inmemory).
      PICHESS_BACKEND: "${PICHESS_BACKEND:-inmemory}"
      PICHESS_CACHE: "${PICHESS_CACHE:-none}"
      KAFKA_BOOTSTRAP_SERVERS: "${PICHESS_KAFKA:-}"
      # Durable-backend coordinates — inert unless PICHESS_BACKEND selects them.
      PICHESS_MONGO_URL: "mongodb://mongodb:27017"
      PICHESS_MONGO_DB: "pichess"
      PICHESS_REDIS_HOST: "redis"
      PICHESS_REDIS_PORT: "6379"
    cpus: 2.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9102/metrics >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  gateway:
    image: ${PICHESS_REGISTRY:-ghcr.io/jonaskromer}/pichess-gateway:${PICHESS_IMAGE_TAG:-0.0.2}
    profiles: ["mvp", "lobbies", "full"]
    restart: unless-stopped
    depends_on:
      game-service: {condition: service_healthy}
      lobby-service: {condition: service_healthy, required: false}
    ports:
      - "${PICHESS_HTTP_PORT:-8090}:8090" # the only public entry point
    environment:
      HTTP_PORT: "8090"
      GAME_SERVICE_GRPC: "game-service:9000"
      # Empty in mvp; the lobbies/full env-files point it at lobby-service.
      PICHESS_LOBBY_URL: "${PICHESS_LOBBY_URL:-}"
      PICHESS_STACK: "${PICHESS_BACKEND:-inmemory}"
      # Tournament spectate (browser polls the NowChess server via the gateway)
      # + bot control (gateway signals join/withdraw). bot-control resolves to the
      # full-tier bot-tournament service; the NowChess URL is editable per event.
      # PICHESS_BOT_NAME must match bot-tournament's TOURNAMENT_BOT_NAME or the
      # spectate list hides our own games.
      PICHESS_TOURNAMENT_URL: "${PICHESS_TOURNAMENT_URL:-http://141.37.123.132:8086}"
      PICHESS_BOT_CONTROL_URL: "${PICHESS_BOT_CONTROL_URL:-http://bot-tournament:8080}"
      PICHESS_BOT_NAME: "${PICHESS_BOT_NAME:-piChess}"
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  # --- lobbies --------------------------------------------------------------
  lobby-service:
    image: ${PICHESS_REGISTRY:-ghcr.io/jonaskromer}/pichess-lobby-service:${PICHESS_IMAGE_TAG:-0.0.2}
    profiles: ["lobbies", "full"]
    restart: unless-stopped
    depends_on:
      mongodb: {condition: service_healthy, required: false}
      redis:   {condition: service_healthy, required: false}
    environment:
      LOBBY_PORT: "8092"
      PICHESS_BACKEND: "${PICHESS_BACKEND:-inmemory}"
      PICHESS_CACHE: "${PICHESS_CACHE:-none}"
      PICHESS_MONGO_URL: "mongodb://mongodb:27017"
      PICHESS_MONGO_DB: "pichess"
      PICHESS_REDIS_HOST: "redis"
      PICHESS_REDIS_PORT: "6379"
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/healthcheck 2>&1 | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  # --- full: durable persistence + event log --------------------------------
  repository:
    image: ${PICHESS_REGISTRY:-ghcr.io/jonaskromer}/pichess-repository:${PICHESS_IMAGE_TAG:-0.0.2}
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      kafka:   {condition: service_healthy}
      mongodb: {condition: service_healthy}
    environment:
      REPOSITORY_PORT: "8091"
      PICHESS_BACKEND: "mongo" # repository only exists in the full tier
      PICHESS_CACHE: "redis"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_CONSUMER_GROUP: "pichess-repository"
      PICHESS_MONGO_URL: "mongodb://mongodb:27017"
      PICHESS_MONGO_DB: "pichess"
      PICHESS_REDIS_HOST: "redis"
      PICHESS_REDIS_PORT: "6379"
    cpus: 1.0
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --server-response http://localhost:8091/games/healthcheck 2>&1 | grep -q '404'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  mongodb:
    # 4.4 = last MongoDB without an AVX requirement (HTWG QEMU vCPUs lack AVX, so
    # mongo:5+ crash-loops — SERVER-54407). Predates mongosh → legacy `mongo` shell.
    image: mongo:4.4
    profiles: ["full"]
    restart: unless-stopped
    volumes:
      - pichess-mongo-data:/data/db
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ping:1}).ok' | mongo --quiet | grep -q 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    profiles: ["full"]
    restart: unless-stopped
    # Single-node KRaft (no Zookeeper); advertised + controller voter both point
    # at the service name `kafka` — same wiring as deploy/k8s/overlays/full/kafka.yaml.
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "pichess-cluster-0001"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Cap broker heap under the 1g mem_limit (image default -Xmx1G == limit →
      # OOM under load). Matches deploy/k8s/overlays/full/kafka.yaml.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - pichess-kafka-data:/var/lib/kafka/data
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- tournament bridge: piChess engine ↔ NowChess server (full tier) -------
  # Plays bot-vs-bot tournament games: registers, joins, streams each game's
  # events, drives the engine to choose moves, posts them back. Exposes a control
  # API (:8080) the gateway signals (join/withdraw) + Prometheus metrics (:9107).
  # OUTBOUND-only to the NowChess server; engine weights ship in the image. No
  # published port — internal only (gateway reaches it at bot-tournament:8080;
  # NEVER expose /control publicly).
  bot-tournament:
    image: ${PICHESS_REGISTRY:-ghcr.io/jonaskromer}/pichess-bot-tournament:${PICHESS_IMAGE_TAG:-0.0.2}
    profiles: ["full"]
    restart: unless-stopped
    environment:
      TOURNAMENT_BASE_URL: "${PICHESS_TOURNAMENT_URL:-http://141.37.123.132:8086}"
      TOURNAMENT_BOT_NAME: "${PICHESS_BOT_NAME:-piChess}"
      TOURNAMENT_CONTROL_PORT: "8080"
      METRICS_PORT: "9107"
      JAVA_OPTS: "-Xmx1024m" # off-heap + NNUE net live outside the heap
    cpus: 2.0
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # --- analytics: post-game / tournament aggregation (full tier) -------------
  # spark sessionizes chess.game-events → chess.analytics; analytics-service
  # serves the aggregates. Opening NAMING is in-process EcoBook (no opening-
  # service / neo4j needed here — that's a separate move-popularity graph).
  analytics-service:
    image: ${PICHESS_REGISTRY:-ghcr.io/jonaskromer}/pichess-analytics-service:${PICHESS_IMAGE_TAG:-0.0.2}
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      ANALYTICS_PORT: "8093"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_CONSUMER_GROUP: "pichess-analytics" # distinct from repository's
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8093/healthcheck 2>&1 | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  spark-analytics:
    image: ${PICHESS_REGISTRY:-ghcr.io/jonaskromer}/pichess-spark-analytics:${PICHESS_IMAGE_TAG:-0.0.2}
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      PICHESS_SPARK_CHECKPOINT: "/var/pichess/spark/analytics-sink"
      JAVA_TOOL_OPTIONS: >-
        -Xmx1g
        -Djava.security.manager=allow
        -Duser.language=en -Duser.country=US
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
        --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.net=ALL-UNNAMED
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
        --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
        --add-opens=java.base/sun.nio.cs=ALL-UNNAMED
        --add-opens=java.base/sun.security.action=ALL-UNNAMED
        --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
        --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED
    volumes:
      - pichess-spark-checkpoint:/var/pichess/spark
    cpus: 1.0
    mem_limit: 1536m

  # --- prod-obs: prometheus + grafana (no jaeger) ---------------------------
  # Opt-in profile so obs is separable from the app tiers. Activate with an extra
  # --profile prod-obs (or add it to full.env's COMPOSE_PROFILES). Configs are
  # bind-mounted from the repo checkout on the deploy host.
  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: ["prod-obs"]
    restart: unless-stopped
    volumes:
      - ../../docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
    cpus: 0.25
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["prod-obs"]
    restart: unless-stopped
    depends_on:
      prometheus: {condition: service_started}
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer" # behind the VPN; harden for public
      GF_USERS_DEFAULT_THEME: "light"
    volumes:
      - ../../docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    cpus: 0.25
    mem_limit: 256m

volumes:
  pichess-mongo-data:
  pichess-kafka-data:
  pichess-spark-checkpoint:
