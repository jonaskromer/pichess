<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<!--
  GRID-ONLY overlay (printed ruling). The crumpled-paper texture + lighting it
  used to carry now comes from the shared #crumple-tile / #crumple-hard /
  #crumple-soft pipeline (see HtmlPage), so panels can light a baked, constant-
  size heightmap per theme. This symbol is just the ruling, drawn on top of that
  crumple layer in `paperLayer()`; it stays in the 600 viewBox + slice so the
  grid keeps scaling with the panel exactly as before.

  Grid pattern width/height stay as SVG attributes (24 / 120) — CSS geometry
  properties don't apply to <pattern> in any browser. CSS-tunable per callsite:
    grid-color, grid-minor-width, grid-minor-opacity, grid-major-width,
    grid-major-opacity. Default #7a96ad reads on both light and dark paper
    (the var cascade through <pattern> is unreliable cross-browser).
-->
  <symbol id="paper-grid-square" viewBox="0 0 600 600" overflow="visible">
    <defs>
      <pattern id="grid-grid-minor" width="24" height="24" patternUnits="userSpaceOnUse">
        <path stroke="var(--grid-color, #7a96ad)" fill="none"
              style="stroke-width: var(--grid-minor-width, 0.6);
                     stroke-opacity: var(--grid-minor-opacity, 0.55);"
              d="M 24 0 L 0 0 L 0 24"/>
      </pattern>
      <pattern id="grid-grid-major" width="120" height="120" patternUnits="userSpaceOnUse">
        <path stroke="var(--grid-color, #7a96ad)" fill="none"
              style="stroke-width: var(--grid-major-width, 1.1);
                     stroke-opacity: var(--grid-major-opacity, 0.9);"
              d="M 120 0 L 0 0 L 0 120"/>
      </pattern>
    </defs>

    <!-- Ruling drawn on top of the (separate) crumple layer. -->
    <rect width="600" height="600" fill="url(#grid-grid-minor)"/>
    <rect width="600" height="600" fill="url(#grid-grid-major)"/>
    <!-- Right & bottom edges (the grid pattern only draws top & left of each cell). -->
    <path stroke="var(--grid-color, #7a96ad)" fill="none"
          style="stroke-width: var(--grid-major-width, 1.1);
                 stroke-opacity: var(--grid-major-opacity, 0.9);"
          d="M 600 0 L 600 600 M 0 600 L 600 600"/>
  </symbol>
  <use href="#paper-grid-square"/>
</svg>
