name: metrics

# Self-hosted badge data via a gist. On every push to main, recompute the
# metrics and PATCH them into a public gist using a gist-scoped PAT (the
# GIST_SECRET repo secret). The README "Metrics" badges render each file with
# shields' endpoint badge, reading gist.githubusercontent.com — which shields
# allows (unlike github.com release assets, which it blocks). No repo commits,
# no third-party analysis service.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read # only needs to check the repo out; the gist is updated via GIST_SECRET

concurrency:
  group: metrics
  cancel-in-progress: true

env:
  GIST_ID: edd5d4dd1a82fef389f1118aeaf291f5 # gist.github.com/SloppyPotato/<this>

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure git + bash (see the script) — writes badges/<metric>.json.
      - name: Generate badge JSONs
        run: bash scripts/gen-badges.sh badges

      - name: Update the badge gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_SECRET }}
        run: |
          payload=$(jq -n \
            --arg loc      "$(cat badges/loc.json)" \
            --arg modules  "$(cat badges/modules.json)" \
            --arg tests    "$(cat badges/tests.json)" \
            --arg techdebt "$(cat badges/techdebt.json)" \
            '{files: {"loc.json": {content: $loc}, "modules.json": {content: $modules}, "tests.json": {content: $tests}, "techdebt.json": {content: $techdebt}}}')
          curl -fsS -X PATCH \
            -H "Authorization: token ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/${GIST_ID}" \
            -d "${payload}" -o /dev/null
          echo "gist ${GIST_ID} updated"
