apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
    pichess.tier: full # reset.yml prunes this label's tier when downgrading
spec:
  clusterIP: None # headless, for the StatefulSet
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: mongodb
    pichess.tier: full
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: mongodb
          pichess.tier: full # so `reset.yml -e pichess_wipe_data=true` can select the PVC
      spec:
        accessModes: ["ReadWriteOnce"] # k3s local-path provisioner
        resources:
          requests:
            storage: 2Gi
