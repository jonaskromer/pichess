// Pichess scalafix baseline. Opt-in lint via `make scalafix-check` (dry-run,
// no edits) and `make scalafix-fix` (apply auto-fixes). Not part of the
// default test gate — the gate is scoverage + tests; scalafix is a
// hygiene-on-demand tool.

rules = [
  // Drop unused imports / local defs / private members. Compiler can warn
  // for these too but the warnings are silenced via `-Wconf:any:s` to keep
  // CI logs quiet — scalafix is the authoritative checker.
  RemoveUnused

  // Consistent import order: scala.* / java.* / com.* / dev.zio.* /
  // chess.* (our own packages) split into groups separated by blank
  // lines. Within a group, alphabetic. Reduces churn on import-only
  // diffs across PRs.
  OrganizeImports

  // Forbid the common foot-guns. Each rule below is syntax-only — no
  // SemanticDB needed — so they're cheap and always reliable.
  DisableSyntax
]

OrganizeImports {
  // The Scala 3 dialect for OrganizeImports — required as of v0.6.x.
  targetDialect = Scala3
  groupedImports = Merge
  expandRelative = true
  // Group order: stdlib first, then 3rd-party (alphabetised), then ours.
  groups = [
    "re:javax?\\..*",
    "scala.",
    "*",
    "chess."
  ]
}

DisableSyntax {
  // ── Disabled rules — kept here for visibility ─────────────────────────
  //
  // The "strict" DisableSyntax baseline would forbid `var`, `null`,
  // `isInstanceOf`/`asInstanceOf`, and `throw`. Scanning the codebase
  // surfaced 105 violations across those rules, almost all in legitimate
  // perf-critical or Java-interop locations:
  //
  //   - `var`: 61 hits, concentrated in bitboard popCount loops
  //     (Position iter, BitboardAttacks builder), JMH @State fields,
  //     and the FEN/SAN parser state machines. Switching to `Iterator`
  //     / `foldLeft` here would cost measurable cycles on the hot path.
  //   - `asInstanceOf`/`isInstanceOf`: 36 hits, dominated by web-ui's
  //     Laminar DOM-event handlers (idiomatic in the Laminar API) and
  //     SOA-style envelope unwrapping in the persistence drivers.
  //   - `null`: 8 hits, all in JDBC / Cassandra / Kafka Java-driver
  //     interop where `null` is the documented sentinel.
  //   - `throw`: 7 hits, mostly Map.apply-contract throws
  //     (`NoSuchElementException` matching the std-lib contract) and
  //     bench setup.
  //
  // Re-enable selectively when refactoring those specific areas —
  // marker comments (`// scalafix:off DisableSyntax.noVars`) opt out
  // per-block when needed.
  //
  // ── Enforced rules ────────────────────────────────────────────────────

  // No `return` — non-local returns are almost always a control-flow
  // smell; Option/Either/foldLeft is more honest and avoids the
  // surprise. Zero current violations.
  noReturns = true
}
