---
# OS baseline for a blank Ubuntu 24.04 host: reachability, packages, an
# optional SSH key, and a k3s-aware firewall. Every task is idempotent.

- name: Wait until the host accepts connections (survive a just-booted/rebooted VM)
  ansible.builtin.wait_for_connection:
    timeout: 90

- name: Refresh the apt cache (no-op if fresher than 1h)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages (k3s is otherwise self-contained)
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - apparmor # containerd uses it on Ubuntu
    state: present

- name: Guard — refuse to authorize anything that is not an OpenSSH PUBLIC key
  ansible.builtin.assert:
    that:
      - "'PRIVATE KEY' not in _pichess_authkey"
      - _pichess_authkey is match('(ssh-|ecdsa-sha2-|sk-).+')
    fail_msg: >-
      ssh_public_key ({{ ssh_public_key }}) does not look like an OpenSSH public key.
      Refusing to write it to authorized_keys on this shared, externally-managed host —
      pass a *.pub file (e.g. a dedicated ~/.ssh/pichess_htwg.pub), never a private key.
    success_msg: ssh_public_key is a public key — safe to authorize.
    quiet: true
  vars:
    _pichess_authkey: "{{ lookup('file', ssh_public_key) }}"
  when: ssh_public_key is defined and ssh_public_key | length > 0

- name: Authorize the operator's SSH key (so later runs drop the password)
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ lookup('file', ssh_public_key) }}"
    state: present
  become: false
  when: ssh_public_key is defined and ssh_public_key | length > 0

# --- firewall (k3s-aware; the campus edge is the primary gate) --------------
- name: Allow inbound service ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_ports }}"
  when: configure_ufw | bool

- name: Allow intra-cluster traffic from the pod + service CIDRs
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
  loop:
    - "{{ k3s_pod_cidr }}"
    - "{{ k3s_service_cidr }}"
  when: configure_ufw | bool

- name: Allow routed/forwarded traffic (k3s flannel needs it)
  community.general.ufw:
    direction: routed
    default: allow
  when: configure_ufw | bool

- name: Enable ufw with default-deny incoming (SSH already allowed above)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: configure_ufw | bool
