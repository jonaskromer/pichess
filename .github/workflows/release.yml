name: release

# Deliberate, tag-driven publishing. Pushing a version tag (e.g. v0.0.1)
# builds the deployable service images for both architectures and pushes them
# to GHCR tagged with that version. Day-to-day commits never trigger this —
# only an explicit tag — keeping "tested" (every push, via test.yml) and
# "released" (an image exists) cleanly separate.
on:
  push:
    tags:
      - "v*" # e.g. v0.0.1 — switch to "release-v*" if you prefer that prefix
             # (then also adjust VERSION stripping in the build step below)

permissions:
  contents: write # create the GitHub Release on the tag push
  packages: write # GITHUB_TOKEN can push to ghcr.io for this repo's owner

jobs:
  # Gate: re-run the full coverage + test suite on the exact tagged commit so
  # a broken release can never be published.
  test:
    uses: ./.github/workflows/test.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23 + sbt cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: sbt
      - uses: sbt/setup-sbt@v1

      # QEMU lets buildx assemble the arm64 variant on this amd64 runner.
      # Scala→JVM bytecode is arch-independent, so the SAME staged JARs layer
      # onto each arch's JRE base; only the base + a couple of trivial RUN
      # steps (user/chmod) differ per arch — cheap to emulate.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tailwind v4 standalone CLI (no Node toolchain — see Makefile). Writes
      # gateway/src/main/resources/web/style.css, which the gateway image bundles.
      - name: Build production CSS
        run: make tailwind-build

      # One sbt invocation: compile the shared modules once, then stage all
      # four deployable services. `Docker/stage` only writes the Dockerfile +
      # (arch-independent) JARs into <module>/target/docker/stage — it does NOT
      # run docker build; buildx does that next, multi-arch, from that context.
      # (Staging gateway also runs web-ui's fastLinkJS via its resourceGenerator,
      # so the bundled JS is produced here; the other three are plain services.)
      - name: Stage deployable service images
        run: >
          sbt
          gateway/Docker/stage
          gameService/Docker/stage
          repository/Docker/stage
          lobbyService/Docker/stage
          botTournament/Docker/stage
          analyticsService/Docker/stage
          sparkAnalytics/Docker/stage

      - name: Build multi-arch images and push to GHCR
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${GITHUB_REF_NAME#v}"   # v0.0.1 -> 0.0.1
          SHA="${GITHUB_SHA::7}"
          # image name -> sbt module dir holding target/docker/stage
          declare -A DIRS=(
            [pichess-gateway]=gateway
            [pichess-game-service]=game-service
            [pichess-repository]=repository
            [pichess-lobby-service]=lobby-service
            [pichess-bot-tournament]=bot-tournament
            [pichess-analytics-service]=analytics-service
            [pichess-spark-analytics]=spark-analytics
          )
          for img in "${!DIRS[@]}"; do
            ctx="${DIRS[$img]}/target/docker/stage"
            echo "::group::buildx ${img}"
            docker buildx build "$ctx" \
              --platform linux/amd64,linux/arm64 \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              -t "ghcr.io/${OWNER}/${img}:${VERSION}" \
              -t "ghcr.io/${OWNER}/${img}:sha-${SHA}" \
              --push
            echo "::endgroup::"
          done
          {
            echo "### Published \`${VERSION}\` (sha-${SHA})";
            for img in "${!DIRS[@]}"; do echo "- \`ghcr.io/${OWNER}/${img}:${VERSION}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      # Mark the tag as a published GitHub Release — this is what the README
      # "latest release" badge reads. Idempotent: skip if it already exists
      # (so re-running the workflow on the same tag won't error).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
