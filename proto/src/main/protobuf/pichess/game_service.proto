syntax = "proto3";

package pichess;

// gRPC contract for the gameService microservice.
//
// Wire format: `StateReply.board_state` carries a `BoardStateDto`
// serialised via `Schema[BoardStateDto].protobufCodec` (zio-schema-
// protobuf). Game-service constructs the DTO directly from the in-memory
// `GameState`; the gateway decodes the bytes and forwards the DTO to the
// HTTP client as JSON. This sidesteps the FEN-parse round-trip the
// gateway used to do on every reply.
//
// `gameId` is the partition key used by the Kafka producer; clients must
// reuse the id returned by NewGame/LoadGame for subsequent rpcs on the same
// game.
service GameService {
  // Lifecycle
  rpc NewGame      (NewGameRequest)      returns (StateReply);
  rpc LoadGame     (LoadGameRequest)     returns (StateReply);

  // Commands — each mutates the per-game SessionState and produces an event
  // on chess.game-events.
  rpc MakeMove     (MoveRequest)         returns (StateReply);
  rpc Undo         (GameIdRequest)       returns (StateReply);
  rpc Redo         (GameIdRequest)       returns (StateReply);
  rpc ClaimDraw    (GameIdRequest)       returns (StateReply);
  rpc Forfeit      (GameIdRequest)       returns (StateReply);

  // Queries
  rpc GetState     (GameIdRequest)       returns (StateReply);
  rpc ExportGame   (ExportRequest)       returns (ExportReply);

  // Streaming subscription — emits the current state immediately, then every
  // subsequent state change for that game. Powers the gateway's SSE source.
  rpc SubscribeGame(GameIdRequest)       returns (stream StateReply);
}

message NewGameRequest {}

message LoadGameRequest {
  string raw = 1;  // FEN, PGN, or JSON — auto-detected server-side
}

message MoveRequest {
  string game_id = 1;
  string raw     = 2;  // coordinate, castling, or SAN notation
}

message GameIdRequest {
  string game_id = 1;
}

message ExportRequest {
  string game_id = 1;
  string format  = 2;  // fen | pgn | json
}

// Universal state response.
//
// `board_state` is a `BoardStateDto` (defined in the shared `api`
// module) serialised via its `Schema[BoardStateDto].protobufCodec`.
// The DTO already carries the board squares, active color, move log,
// in-check flag, game status, and any embedded error string. The hot
// reply→HTTP path on the gateway only uses this field — no FEN parse.
//
// `fen` is kept as a sidecar for the annotation endpoints
// (`/legal-moves`, `/threats`, `/attackers`) — those need full
// GameState (castling rights, en-passant target) which the DTO doesn't
// carry. They run on a separate cached path off the hot reply.
message StateReply {
  string game_id     = 1;
  bytes  board_state = 2;
  string error       = 3;  // empty when the action succeeded
  string fen         = 4;  // sidecar for annotation endpoints
}

message ExportReply {
  string format = 1;
  string body   = 2;
}
