<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6 6" width="6" height="6">
<!--
  Diagonal hatch tile used as a CSS mask on the overlayScrollbars handle.
  Two parallel diagonals so the tile reads as a continuous hatch when
  repeated. Stroke colour is black (any opaque value) — only the alpha
  channel matters because consumers reference this via `mask-image`,
  pairing it with `background-color: currentColor` so the visible colour
  theme-cascades from CSS without any var()-in-data-URL gymnastics.
-->
  <path d="M -1 4 L 4 -1 M 2 7 L 7 2" stroke="black" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>
