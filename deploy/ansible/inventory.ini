# Two targets. Develop against `local` (a Multipass Ubuntu 24.04 VM) until the
# pipeline is solid; only then run against `htwg`. Playbooks default to `local`
# (see `hosts:` in provision.yml/deploy.yml) so you can't hit the real box by
# accident — pass `-e target=htwg` to opt in.
#
# No secrets live here: the htwg connection vars are read from the environment
# in group_vars/htwg.yml. Source .env.local (or use the Makefile) first.

[local]
# Fill in from `multipass info pichess-vm` (the VM's IPv4) and your key.
pichess-test ansible_host=CHANGE_ME ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[htwg]
# ansible_host / user / password come from the environment (group_vars/htwg.yml).
pichess-prod
