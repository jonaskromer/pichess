---
# Deploy the selected tier's kustomize overlay onto an already-provisioned host.
# Idempotent (kustomize apply converges to desired state). Fast loop — run this
# repeatedly; run provision.yml only when the box changes.
#
#   ansible-playbook deploy.yml                                   # mvp -> local
#   ansible-playbook deploy.yml -e target=htwg -e pichess_tier=full
- name: Deploy pichess
  hosts: "{{ target | default('local') }}"
  become: "{{ pichess_become | default(true) }}" # k3d path (htwg) sets false
  gather_facts: true # k3d path needs ansible_env.HOME for the kubeconfig/dest paths
  roles:
    - pichess
