apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pichess
# full = lobbies + durable persistence: repository read-side, Kafka event log,
# Mongo primary store, Redis cache. The configMapGenerator below merges the
# durable-backend values over the base's in-memory ones; the resulting hash
# change rolls the JVM pods onto mongo+kafka+redis automatically. Needs ~8-12 GB
# RAM (5 JVMs + Kafka + Mongo) — see docs/deployment-plan.md and project memory.
resources:
  - ../lobbies
  - mongodb.yaml
  - redis.yaml
  - kafka.yaml
  - repository.yaml
  # Optional containerised tournament bot (gateway-signalled control API). It
  # only talks OUTBOUND to the NowChess server, so it rides the full tier here.
  - bot-tournament.yaml
  # Analytics tier: spark sessionizes chess.game-events → chess.analytics;
  # analytics-service serves the aggregates. Powers post-game / tournament
  # analytics. (Game-OPENING naming is in-process EcoBook, so no opening-service
  # / neo4j here — that's a separate move-popularity graph, left dev-only.)
  - analytics-service.yaml
  - spark-analytics.yaml
  # prod-obs: prometheus + grafana (NO jaeger — tracing/profiling is dev-only).
  - prometheus.yaml
  - grafana.yaml
  # Host-based ingress (nip.io wildcard DNS) exposing the two obs UIs over the VPN.
  - ingress-obs.yaml

configMapGenerator:
  - name: pichess-config
    behavior: merge
    literals:
      - PICHESS_BACKEND=mongo
      - PICHESS_CACHE=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=pichess-repository
      - PICHESS_MONGO_URL=mongodb://mongodb:27017
      - PICHESS_MONGO_DB=pichess
      - PICHESS_REDIS_HOST=redis
      - PICHESS_REDIS_PORT=6379
      - REPOSITORY_PORT=8091
      # Spectate's default "piChess bot games only" filter matches tournament
      # games by the bot's registered name — keep in sync with
      # bot-tournament.yaml's TOURNAMENT_BOT_NAME (gateway defaults to "pichess"
      # otherwise, which would hide every game on this tier).
      - PICHESS_BOT_NAME=piChess
      # Obs UI base URLs → injected into the gateway-served SPA (StackInfo →
      # HtmlPage meta tags) so the Analytics screen's dashboard + Prometheus
      # links resolve over the VPN. Match ingress-obs.yaml's nip.io hosts.
      - PICHESS_GRAFANA_URL=http://grafana.141.37.123.131.nip.io
      - PICHESS_PROMETHEUS_URL=http://prometheus.141.37.123.131.nip.io
  # prod-obs config, generated from files copied into ./config so the default
  # kustomize load-restrictor (no ../.. refs) is satisfied.
  - name: prometheus-config
    files:
      - prometheus.yml=config/prometheus.yml
  - name: grafana-datasources
    files:
      - datasource.yml=config/grafana-datasource.yml
  - name: grafana-dashboards-provider
    files:
      - dashboards.yml=config/grafana-dashboards-provider.yml
  - name: grafana-dashboards
    files:
      - config/dashboards/pichess.json
      - config/dashboards/pichess-tournament.json
      - config/dashboards/pichess-analytics.json

images:
  - name: ghcr.io/jonaskromer/pichess-repository
    newTag: "1.0.0"
  - name: ghcr.io/jonaskromer/pichess-bot-tournament
    newTag: "1.0.0"
  # analytics + spark images: published by release.yml as of this change. Bump
  # these together with the others at each release (they only resolve once a
  # release ≥ the version that first publishes them has run).
  - name: ghcr.io/jonaskromer/pichess-analytics-service
    newTag: "1.0.0"
  - name: ghcr.io/jonaskromer/pichess-spark-analytics
    newTag: "1.0.0"
